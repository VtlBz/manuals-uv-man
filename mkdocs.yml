site_name: "uv - Руководство для Python-разработчиков"
site_description: >-
  Практическое руководство по менеджеру uv для Python-разработчиков.
  От основ до продвинутых сценариев.

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Темная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

plugins:
  - search:
      lang: ru
  - include-markdown

nav:
  - Главная: index.md
  - "1. Введение и мотивация": 01-introduction.md
  - "2. Установка и настройка": 02-installation.md
  - "3. Управление версиями Python": 03-python-versions.md
  - "4. Инициализация проекта": 04-project-init.md
  - "5. Виртуальные окружения": 05-environments.md
  - "6. Управление зависимостями": 06-dependencies.md
  - "7. Sync-workflow": 07-sync-workflow.md
  - "8. Запуск кода и инструментов": 08-running-code.md
  - "9. Конфигурация": 09-configuration.md
  - "10. Docker и CI/CD": 10-docker-ci.md
  - "11. Сборка и публикация пакетов": 11-publishing.md
  - "12. Миграция с существующих инструментов": 12-migration.md
  - "13. Workspaces": 13-workspaces.md
  - "14. Диагностика и решение проблем": 14-troubleshooting.md
  - "15. Best Practices и справочник": 15-best-practices.md
